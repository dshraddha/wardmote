# ============================================================
# [project] — METADATA
# This section tells PyPI, pip, and uv what your package is.
# ============================================================
[project]
name = "wardmote"
version = "0.0.1"
description = "One pipeline for every LLM security detector"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["llm", "security", "prompt-injection", "guardrails", "ai-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# ============================================================
# DEPENDENCIES
# The core library needs only one dependency: Pydantic.
# Optional dependencies are installed with wardmote[presidio] etc.
# ============================================================
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
presidio = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
llm-guard = ["llm-guard>=0.3"]
all = ["wardmote[presidio,llm-guard]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "build>=1.2",
    "twine>=5.0",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

# ============================================================
# CLI ENTRY POINT
# After installing, users can run `wardmote scan ...` from terminal.
# ============================================================
[project.scripts]
wardmote = "wardmote.cli:main"

# ============================================================
# BUILD SYSTEM
# Tells Python how to build the package. Hatchling is modern and fast.
# ============================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wardmote"]

# ============================================================
# RUFF — linting and formatting
# Ruff replaces flake8, isort, and black in one tool.
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",   # pycodestyle (style)
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear (common bugs)
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "S",   # flake8-bandit (security)
    "TCH", # type-checking imports
]
ignore = ["S101"] # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

# ============================================================
# MYPY — static type checking
# strict = true means no untyped functions allowed.
# ============================================================
[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
files = ["src/wardmote"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["presidio_analyzer.*", "presidio_anonymizer.*", "llm_guard.*"]
ignore_missing_imports = true

# ============================================================
# PYTEST — test runner
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=wardmote",
    "--cov-report=term-missing",
]
markers = [
    "integration: marks tests as integration",
    "slow: marks tests as slow",
    "adversarial: marks adversarial/bypass tests",
]

# ============================================================
# COVERAGE — test coverage requirements
# fail_under = 90 means CI fails if coverage drops below 90%.
# ============================================================
[tool.coverage.run]
branch = true
source = ["wardmote"]

[tool.coverage.report]
fail_under = 80
show_missing = true

# ============================================================
# BANDIT — security linter for Python source
# ============================================================
[tool.bandit]
exclude_dirs = ["tests", "examples"]
